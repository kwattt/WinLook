[package]
name = "winlook"
version = "0.2.1"
edition = "2021"
description = "Ultra-lightweight Google Lens for Windows built with Rust, GPUI, Windows.Media.Ocr, and DeepSeek Vision"
license = "MIT"

[dependencies]
# GPUI & Component Suite (Longbridge gpui-kit + gpui-component + GPUI)
gpui = { version = "=0.3.12", package = "gpui-pre" }
gpui-component = "0.9.1"
gpui-kit = "0.9.1"

# Async Runtime & HTTP Client (DeepSeek Vision SSE + Google Lens Upload)
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"

# Serialization & Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
anyhow = "1.0"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
open = "5.3"

# Desktop Integration (Global Hotkeys, Tray Icon, Clipboard, Credential Manager)
global-hotkey = "0.6"
tray-icon = "0.19"
arboard = "3.4"
keyring = { version = "3.6", features = ["windows-native"] }

# Windows Native APIs (Windows.Media.Ocr, Graphics Capture, GDI/DXGI, DPI)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
